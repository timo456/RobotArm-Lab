name: Verify RobotArm-Lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0
      # Cache complete wheels here. The bootstrap uses a checkout-local pip cache,
      # so setup-python's default user-cache path may not exist (notably on Windows).
      - uses: actions/cache@v4
        with:
          path: .cache/wheelhouse
          key: wheels-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            wheels-${{ runner.os }}-${{ matrix.python }}-
      # Block scalars keep pip's ':all:' arguments out of YAML mapping syntax.
      - run: |
          python -m pip install --only-binary=:all: packaging==26.3
      - if: runner.os == 'Linux'
        run: |
          python scripts/prepare_wheelhouse.py
      - if: runner.os == 'Windows'
        run: |
          python scripts/prepare_wheelhouse.py --allow-source-build
      - run: |
          python -m pip install --no-index --only-binary=:all: --find-links .cache/wheelhouse -r requirements-lock.txt
      - run: |
          python -m pip install --no-deps --no-build-isolation -e .
      - run: |
          python -m ruff check .
      - run: |
          python -m ruff format --check .
      - run: |
          python -m pytest --cov=robotarm_lab --cov-report=xml:outputs/coverage.xml --junitxml=outputs/pytest.xml
      - run: |
          python -m robotarm_lab benchmark --output outputs/benchmark
      - run: |
          python scripts/hardening.py --output outputs/hardening
      - run: |
          python -m robotarm_lab demo --output outputs/demo
      - name: Actual Qt workstation interactions (Linux software GL)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python scripts/workstation_verify.py --functional-only --output outputs/workstation
      - name: Actual Qt workstation interactions (Windows software GL)
        if: runner.os == 'Windows'
        run: |
          python scripts/workstation_verify.py --functional-only --output outputs/workstation
      - run: |
          python -m build --no-isolation
      - name: Clean installed wheel including Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python scripts/clean_environment.py
      - name: Clean installed wheel including Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/clean_environment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            outputs/
            dist/

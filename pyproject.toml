[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotarm-lab"
version = "0.2.0"
description = "An inspectable six-axis robotics simulation and control laboratory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "numpy==2.2.6", "scipy==1.15.3", "pybullet==3.2.7", "pillow==11.3.0",
    "PySide6-Essentials==6.8.3", "shiboken6==6.8.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.14.3", "build==1.3.0"]

[project.scripts]
robotarm-lab = "robotarm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotarm_lab = ["assets/*.urdf", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.tmp/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
